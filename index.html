<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IT Assessment Board</title>
<meta name="description" content="Evaluación integral del área de TI. Transformación ExO.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
  // Configuración del proyecto propio de Supabase (Settings, API).
  // La llave publicable es pública por diseño; la seguridad la dan RLS y las funciones del servidor.
  window.IAB_CONFIG = window.IAB_CONFIG || {
    SUPABASE_URL: "https://TU-PROYECTO.supabase.co",
    SUPABASE_KEY: "TU_LLAVE_PUBLICABLE_O_ANON"
  };
</script>
<style>
:root{
  --navy:#14284b; --navy-2:#1e3a6b; --navy-3:#2c5197; --ink:#1b2333; --muted:#5b667a; --line:#dde3ec;
  --bg:#f5f7fb; --card:#ffffff; --soft:#eef2f8; --ok:#1d7a4f; --ok-bg:#e5f4ec; --warn:#9a6200; --warn-bg:#fdf3dc;
  --bad:#b42318; --bad-bg:#fdeceb; --info-bg:#e8eefb; --radius:10px;
  --A:#1d7a4f; --B:#3d8b3d; --C:#9a6200; --D:#c2410c; --E:#b42318;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
a{color:var(--navy-3)}
button,input,select,textarea{font:inherit;color:inherit}
header.top{background:var(--navy);color:#fff;position:sticky;top:0;z-index:20}
header.top .in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header.top .brand{font-weight:700;letter-spacing:.2px;cursor:pointer}
header.top .brand small{display:block;font-weight:400;opacity:.75;font-size:12px}
header.top .sp{flex:1}
header.top .user{font-size:13px;opacity:.85}
header.top button{background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:8px;padding:5px 10px;cursor:pointer}
main{max-width:1180px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:24px;margin:0 0 4px;color:var(--navy)}
h2{font-size:18px;margin:24px 0 10px;color:var(--navy)}
h3{font-size:15px;margin:16px 0 8px;color:var(--navy)}
.sub{color:var(--muted);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:16px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:820px){.g2,.g3,.g4{grid-template-columns:1fr}}
label.f{display:block;font-size:13px;font-weight:600;color:var(--navy-2);margin-bottom:4px}
label.f .req{color:var(--bad)}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],input[type=tel],select,textarea{
  width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:#fff}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--navy-3);outline-offset:-1px;border-color:var(--navy-3)}
.hint{font-size:12px;color:var(--muted);margin-top:3px}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--navy);color:#fff;border:0;border-radius:8px;padding:9px 16px;cursor:pointer;font-weight:600;text-decoration:none}
.btn:hover{background:var(--navy-2)}
.btn.sec{background:#fff;color:var(--navy);border:1px solid var(--line)}
.btn.sec:hover{background:var(--soft)}
.btn.danger{background:#fff;color:var(--bad);border:1px solid #f1c3bf}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.right{margin-left:auto}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 0 18px;overflow-x:auto}
.tabs a{padding:9px 14px;text-decoration:none;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;font-weight:500}
.tabs a.on{color:var(--navy);border-color:var(--navy)}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--navy-2)}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.bad{background:var(--bad-bg);color:var(--bad)}
.msg{padding:10px 14px;border-radius:8px;margin:0 0 14px;font-size:14px}
.msg.ok{background:var(--ok-bg);color:var(--ok)}
.msg.err{background:var(--bad-bg);color:var(--bad)}
.msg.warn{background:var(--warn-bg);color:var(--warn)}
.msg.info{background:var(--info-bg);color:var(--navy-2)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:600;background:var(--soft)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto}
.empty{color:var(--muted);text-align:center;padding:30px}
.auth{max-width:420px;margin:50px auto}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.switch input{width:18px;height:18px}
.prog{height:8px;background:var(--soft);border-radius:99px;overflow:hidden}
.prog>i{display:block;height:100%;background:var(--navy-3)}
/* Cuestionario */
.qwrap{display:grid;grid-template-columns:260px minmax(0,1fr);gap:18px}
@media (max-width:900px){.qwrap{grid-template-columns:1fr}}
.secs{position:sticky;top:70px;align-self:start}
@media (max-width:900px){.secs{position:static}}
.secs a{display:block;padding:8px 10px;border-radius:8px;text-decoration:none;color:var(--ink);margin-bottom:2px}
.secs a.on{background:var(--navy);color:#fff}
.secs a .prog{margin-top:4px;height:4px}
.secs a.on .prog{background:rgba(255,255,255,.25)}
.secs a.on .prog>i{background:#fff}
.q{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:14px}
.q .qh{display:flex;gap:10px;align-items:baseline;margin-bottom:10px}
.q .qn{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
.q .qt{font-weight:600;color:var(--navy)}
.q .st{margin-left:auto;font-size:12px;white-space:nowrap}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;cursor:pointer;background:#fff}
.opt:hover{border-color:var(--navy-3)}
.opt.on{border-color:var(--navy);background:var(--info-bg)}
.opt input{margin-top:4px}
.q.isne .opt{opacity:.45;pointer-events:none}
details.resp{margin-top:8px;border-top:1px dashed var(--line);padding-top:8px}
details.resp summary{cursor:pointer;color:var(--navy-2);font-weight:600;font-size:14px}
details.resp .grid{margin-top:10px}
/* Resultados */
.hero{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center}
@media (max-width:640px){.hero{grid-template-columns:1fr}}
.rating{width:116px;height:116px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:64px;font-weight:700;color:#fff}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:820px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--soft);border-radius:8px;padding:10px 12px}
.kpi b{display:block;font-size:22px;color:var(--navy);font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted)}
.bar{display:grid;grid-template-columns:170px 1fr 48px;gap:10px;align-items:center;margin:6px 0;font-size:14px}
@media (max-width:640px){.bar{grid-template-columns:110px 1fr 40px}}
.bar .tr{height:12px;background:var(--soft);border-radius:99px;position:relative;overflow:hidden}
.bar .tr i{position:absolute;inset:0 auto 0 0;background:var(--navy-3);border-radius:99px}
.bar .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.gate{border:1px solid var(--line);border-radius:8px;padding:12px}
/* Roadmap */
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:980px){.cols{grid-template-columns:1fr}}
.col{background:var(--soft);border-radius:var(--radius);padding:12px}
.col h3{margin:2px 0 10px}
.act{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px;font-size:14px}
.act .meta{font-size:12px;color:var(--muted);margin-top:6px}
.act .grid{gap:8px;margin-top:8px}
.act input,.act select,.act textarea{padding:6px 8px;font-size:13px}
.act textarea{min-height:52px}
/* Informe */
.informe{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:32px}
.informe h1{font-size:26px}
.informe section{page-break-inside:avoid;margin-top:22px}
.legal{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;margin-top:26px}
pre.f{white-space:pre-wrap;background:var(--soft);padding:12px;border-radius:8px;font-size:13px}
.toast{position:fixed;right:16px;bottom:16px;background:var(--navy);color:#fff;padding:10px 14px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;z-index:50;max-width:calc(100% - 32px)}
.toast.on{opacity:1}
.toast.err{background:var(--bad)}
@media print{
  header.top,.tabs,.noprint,.toast{display:none!important}
  body{background:#fff}
  main{padding:0;max-width:none}
  .informe{border:0;padding:0}
  .card{border:1px solid #ccc}
}
</style>
</head>
<body>
<header class="top"><div class="in">
  <div class="brand" onclick="go('#/panel')">IT Assessment Board<small>Transformación ExO</small></div>
  <div class="sp"></div>
  <div class="user" id="who"></div>
  <button id="salir" hidden>Salir</button>
</div></header>
<main id="app"><div class="empty">Cargando...</div></main>
<div class="toast" id="toast"></div>

<script>
"use strict";
// =====================================================================
// Constantes del marco (sin niveles ni clave: eso vive en el servidor)
// =====================================================================
const SECCIONES = {1:"Decisiones y dirección",2:"Proyectos y resultados",3:"Dinero y recursos",4:"Cómo se construye y se entrega",5:"El servicio del día a día",6:"Cuando algo falla",7:"Protección de la información",8:"Base tecnológica y datos",9:"Personas y aliados",10:"Uso real y cambio",11:"Nuevas ideas"};
const BLOQUES = {A:"Estrategia y valor",B:"Entrega y operación",C:"Protección",D:"Capacidad futura"};
const CONTEXTO = [
  ["C1","¿Qué empresa y qué área de TI se evalúan? ¿En qué sectores y países opera?",true],
  ["C2","¿Qué decisión debe informar esta evaluación (inversión, reestructura, cambio de proveedor, plan de IA, venta o auditoría)?",true],
  ["C3","¿Quién patrocina la evaluación y quién recibirá el informe?",true],
  ["C4","¿Cuál es el tamaño de la empresa (empleados, ingresos, sedes) y cuál es su modelo de negocio?",false],
  ["C5","¿Cuáles son los objetivos estratégicos de los próximos 3 años y sus riesgos principales?",false],
  ["C6","¿Cómo está organizada TI, quién la dirige, a quién reporta y cuántas personas internas y externas la componen?",false],
  ["C7","¿Qué periodo se evaluará (12 o 24 meses) y qué sedes, sistemas y áreas quedan dentro del alcance?",true],
  ["C8","¿Hubo evaluaciones o auditorías de TI previas? ¿Qué concluyeron y qué se hizo?",false],
  ["C9","¿Qué regulaciones o contratos con clientes imponen requisitos de tecnología, seguridad o datos?",false],
  ["C10","¿Existen restricciones de acceso a datos o personas, o fechas límite?",false],
  ["C11","¿Qué ajustes de pesos o de umbrales propone el patrocinador? (se justifican por escrito en Pesos y objetivos)",false]
];
const EVIDENCIA = [["verbal","Solo declaración verbal"],["documento","Documento vigente y prueba de uso"],["datos","Datos del periodo evaluado"],["mejora","Mejora demostrada con datos en dos periodos"]];
const ESTADO = {borrador:"Borrador",en_curso:"En curso",provisional:"Provisional",definitiva:"Definitiva"};
const HORIZ = {quick_win:"Quick wins (0 a 30 días)","90_dias":"90 días","12_meses":"12 meses"};
const EST_ACC = {en_brechas:"Registro de brechas",en_plan:"En plan",en_curso:"En curso",cerrada:"Cerrada"};
const COMPUERTA = {cumple:["ok","Abierta"],no_cumple:["bad","Cerrada"],sin_evidencia:["warn","Sin evidencia"]};

// =====================================================================
// Utilidades
// =====================================================================
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const n1 = (v) => v === null || v === undefined ? "NE" : Number(v).toLocaleString("es-CO",{minimumFractionDigits:1,maximumFractionDigits:1});
const n2 = (v) => v === null || v === undefined ? "NE" : Number(v).toLocaleString("es-CO",{minimumFractionDigits:2,maximumFractionDigits:2});
const money = (v) => v === null || v === undefined || v === "" ? "" : Number(v).toLocaleString("es-CO",{maximumFractionDigits:0});
const fecha = (d) => d ? new Date(d).toLocaleDateString("es-CO",{year:"numeric",month:"short",day:"numeric"}) : "";
const go = (h) => { location.hash = h; };
let toastT;
function toast(t, err=false){ const el=$("#toast"); el.textContent=t; el.className="toast on"+(err?" err":""); clearTimeout(toastT); toastT=setTimeout(()=>el.className="toast",err?5000:2200); }
function errMsg(e){ return (e && (e.message || e.error_description || e.details)) || "Error inesperado."; }
function ratingColor(l){ return l ? `var(--${l})` : "var(--muted)"; }

// =====================================================================
// Conexión
// =====================================================================
const CFG = window.IAB_CONFIG;
const configurado = CFG && /^https:\/\//.test(CFG.SUPABASE_URL) && !/TU-PROYECTO/.test(CFG.SUPABASE_URL) && CFG.SUPABASE_KEY && !/^TU_/.test(CFG.SUPABASE_KEY);
const sb = window.IAB_CLIENT || (configurado && window.supabase ? window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_KEY) : null);
let sesion = null;
const cache = { pilares:null, preguntas:null };

async function q(p){ const { data, error } = await p; if (error) throw error; return data; }
async function pilares(){ return cache.pilares ??= await q(sb.from("pilares_cfg").select("n,nombre,bloque,peso,ejes").order("n")); }
async function preguntas(){ return cache.preguntas ??= await q(sb.from("preguntas").select("id,grupo,orden,enunciado,opciones").order("grupo").order("orden")); }
async function evaluacion(id){ return q(sb.from("evaluaciones").select("*").eq("id", id).single()); }

// =====================================================================
// Enrutador
// =====================================================================
const app = $("#app");
async function router(){
  if (!sb){ return vistaConfig(); }
  const h = location.hash || "#/panel";
  const p = h.slice(2).split("/");
  if (!sesion){ return vistaAuth(p[0] === "registro"); }
  try {
    if (p[0] === "panel" || p[0] === "") return await vistaPanel();
    if (p[0] === "nueva") return await vistaDatos(null);
    if (p[0] === "ev" && p[1]){
      const id = p[1], s = p[2] || "datos";
      const ev = await evaluacion(id);
      const vistas = {datos:vistaDatos, contexto:vistaContexto, pesos:vistaPesos, cuestionario:vistaCuestionario, resultados:vistaResultados, roadmap:vistaRoadmap, informe:vistaInforme};
      return await (vistas[s] || vistaDatos)(ev, p[3]);
    }
    go("#/panel");
  } catch(e){ app.innerHTML = `<div class="msg err">${esc(errMsg(e))}</div><a class="btn sec" href="#/panel">Volver al panel</a>`; }
}
window.addEventListener("hashchange", router);

function tabs(ev, on){
  const t = [["datos","Datos generales"],["contexto","Contexto"],["pesos","Pesos y objetivos"],["cuestionario","Cuestionario"],["resultados","Resultados"],["roadmap","Roadmap"],["informe","Informe"]];
  return `<div class="row" style="margin-bottom:6px"><div><h1>${esc(ev.empresa)}</h1>
    <p class="sub" style="margin:0">Evaluador: ${esc(ev.evaluador_nombre)}${ev.evaluador_cargo?", "+esc(ev.evaluador_cargo):""} · <span class="badge">${ESTADO[ev.estado]}</span></p></div></div>
    <nav class="tabs">${t.map(([k,l])=>`<a href="#/ev/${ev.id}/${k}" class="${k===on?"on":""}">${l}</a>`).join("")}</nav>`;
}

// =====================================================================
// Configuración pendiente y acceso
// =====================================================================
function vistaConfig(){
  app.innerHTML = `<div class="card auth" style="max-width:640px">
    <h1>Falta conectar la base de datos</h1>
    <p>Edite <b>index.html</b> y ponga en <code>IAB_CONFIG</code> la URL y la llave publicable de su proyecto de Supabase (Settings, API). Los pasos completos están en README.md.</p>
    ${window.supabase ? "" : `<div class="msg err">No se pudo cargar la librería de Supabase desde el CDN. Revise la conexión.</div>`}
  </div>`;
}

function vistaAuth(registro){
  $("#who").textContent = ""; $("#salir").hidden = true;
  app.innerHTML = `<div class="card auth">
    <h1>${registro ? "Crear cuenta" : "Iniciar sesión"}</h1>
    <p class="sub">${registro ? "Cuenta de evaluador para registrar evaluaciones." : "Ingrese con su correo y contraseña."}</p>
    <div id="m"></div>
    <form id="f" class="grid">
      <div><label class="f">Correo</label><input type="email" name="email" required autocomplete="email"></div>
      <div><label class="f">Contraseña</label><input type="password" name="password" required minlength="8" autocomplete="${registro?"new-password":"current-password"}">
        ${registro?`<div class="hint">Mínimo 8 caracteres.</div>`:""}</div>
      <button class="btn" type="submit">${registro ? "Crear cuenta" : "Entrar"}</button>
    </form>
    <p style="margin-top:16px;font-size:14px">${registro ? `¿Ya tiene cuenta? <a href="#/login">Iniciar sesión</a>` : `¿No tiene cuenta? <a href="#/registro">Crear cuenta</a>`}</p>
  </div>`;
  $("#f").onsubmit = async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target), email = fd.get("email"), password = fd.get("password");
    const m = $("#m"); const b = e.target.querySelector("button"); b.disabled = true;
    try {
      if (registro){
        const { data, error } = await sb.auth.signUp({ email, password });
        if (error) throw error;
        if (!data.session) m.innerHTML = `<div class="msg ok">Cuenta creada. Revise su correo para confirmarla y luego inicie sesión.</div>`;
      } else {
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) throw error;
      }
    } catch(err){ m.innerHTML = `<div class="msg err">${esc(errMsg(err))}</div>`; }
    b.disabled = false;
  };
}

// =====================================================================
// Panel
// =====================================================================
async function vistaPanel(){
  const evs = await q(sb.from("evaluaciones").select("id,empresa,evaluador_nombre,estado,resultados,created_at,updated_at").order("updated_at",{ascending:false}));
  app.innerHTML = `<div class="row"><div><h1>Evaluaciones</h1><p class="sub">Cada evaluación guarda quién la diligencia, la empresa, las respuestas, el resultado y el roadmap.</p></div>
    <a class="btn right" href="#/nueva">Nueva evaluación</a></div>
    <div class="card tbl" style="padding:0">${evs.length ? `<table><thead><tr><th>Empresa</th><th>Evaluador</th><th>Estado</th><th>Rating</th><th>Actualizada</th><th></th></tr></thead><tbody>
    ${evs.map(e=>{ const g=e.resultados?.global; return `<tr>
      <td><a href="#/ev/${e.id}/cuestionario"><b>${esc(e.empresa)}</b></a></td><td>${esc(e.evaluador_nombre)}</td>
      <td><span class="badge">${ESTADO[e.estado]}</span></td>
      <td>${g?.rating_calculado?`<b style="color:${ratingColor(g.rating_calculado)}">${g.rating_calculado}</b> ${n1(g.nota)}${g.provisional?" (provisional)":""}`:"<span class='hint'>Sin calcular</span>"}</td>
      <td>${fecha(e.updated_at)}</td>
      <td class="num"><button class="btn danger sm" data-del="${e.id}" data-n="${esc(e.empresa)}">Eliminar</button></td></tr>`;}).join("")}
    </tbody></table>` : `<div class="empty">Aún no hay evaluaciones. Cree la primera.</div>`}</div>`;
  $$("[data-del]").forEach(b => b.onclick = async () => {
    if (!confirm(`¿Eliminar la evaluación de ${b.dataset.n}? Se borran respuestas, resultados y roadmap. No se puede deshacer.`)) return;
    try { await q(sb.from("evaluaciones").delete().eq("id", b.dataset.del)); toast("Evaluación eliminada"); vistaPanel(); } catch(e){ toast(errMsg(e), true); }
  });
}

// =====================================================================
// Datos generales: quien diligencia y empresa
// =====================================================================
async function vistaDatos(ev){
  const e = ev || { evaluador_correo: sesion.user.email };
  const campo = (k, l, req=false, type="text", hint="") => `<div><label class="f">${l}${req?' <span class="req">*</span>':""}</label>
    <input type="${type}" name="${k}" value="${esc(e[k])}" ${req?"required":""}>${hint?`<div class="hint">${hint}</div>`:""}</div>`;
  app.innerHTML = `${ev ? tabs(ev,"datos") : `<h1>Nueva evaluación</h1><p class="sub">Primero los datos de quien diligencia y de la empresa evaluada.</p>`}

async function vistaPesos(ev){
  const ps = await pilares();
  const lock = ev.pesos_bloqueados;
  const log = ev.ajustes_log || [];
  app.innerHTML = `${tabs(ev,"pesos")}
  ${lock ? `<div class="msg warn">Pesos y objetivos bloqueados porque ya hay respuestas. Para cambiarlos, reábralos indicando el motivo; queda registrado con fecha.</div>` :
    `<p class="sub">Los pesos deben sumar 100. Si cambia algún peso base, la justificación escrita es obligatoria. Se bloquean al registrar la primera respuesta.</p>`}
  ${ev.regulada && !lock ? `<div class="msg info">Empresa regulada o muy dependiente: se sugiere objetivo 4 en Resiliencia y continuidad y en Seguridad y riesgo. <button class="btn sm sec" id="sug">Aplicar sugerencia</button></div>`:""}
  <form id="f"><div class="card tbl" style="padding:0"><table>
    <thead><tr><th>Pilar</th><th>Bloque</th><th class="num">Peso base</th><th class="num">Peso</th><th>Objetivo</th><th>Riesgo si no se actúa</th></tr></thead><tbody>
    ${ps.map(p=>`<tr><td><b>${p.n}. ${esc(p.nombre)}</b><div class="hint">${esc((p.ejes||[]).join(", "))}</div></td>
      <td>${p.bloque}. ${BLOQUES[p.bloque]}</td><td class="num">${Number(p.peso)}</td>
      <td class="num" style="width:110px"><input type="number" min="0" max="100" step="0.5" name="p${p.n}" value="${ev.pesos?.[p.n] ?? p.peso}" ${lock?"disabled":""} style="text-align:right"></td>
      <td style="width:110px"><select name="o${p.n}" ${lock?"disabled":""}>${[2,3,4,5].map(v=>`<option ${Number(ev.objetivos?.[p.n]??3)===v?"selected":""}>${v}</option>`).join("")}</select></td>
      <td style="width:150px"><select name="r${p.n}">${[[1,"Bajo"],[2,"Medio"],[3,"Alto"]].map(([v,l])=>`<option value="${v}" ${Number(ev.riesgos_pilar?.[p.n]??1)===v?"selected":""}>${l}</option>`).join("")}</select></td></tr>`).join("")}
    <tr><td colspan="3"><b>Suma</b></td><td class="num"><b id="suma"></b></td><td colspan="2"></td></tr>
    </tbody></table></div>
    <div class="card"><label class="f">Justificación de los cambios de peso</label>
      <textarea name="just" ${lock?"disabled":""}>${esc(ev.justificacion_pesos)}</textarea>
      <div class="hint">Obligatoria si algún peso difiere del base. El riesgo por pilar (bajo, medio, alto) multiplica la prioridad del roadmap y puede ajustarse siempre.</div></div>
    <div class="row"><button class="btn" type="submit">Guardar</button>
      ${lock?`<button class="btn sec" type="button" id="reabrir">Reabrir pesos</button>`:""}
      <a class="btn sec" href="#/ev/${ev.id}/cuestionario">Ir al cuestionario</a></div>
  </form>
  ${log.length?`<div class="card"><h3 style="margin-top:0">Bitácora de reaperturas</h3>${log.map(l=>`<div>${fecha(l.fecha)}: ${esc(l.motivo)}</div>`).join("")}</div>`:""}`;
  const f = $("#f");
  const suma = () => { const s = ps.reduce((a,p)=>a+Number(f[`p${p.n}`].value||0),0); $("#suma").textContent = s; $("#suma").style.color = Math.abs(s-100)<0.001 ? "var(--ok)" : "var(--bad)"; return s; };
  f.oninput = suma; suma();
  if ($("#sug")) $("#sug").onclick = (e) => { e.preventDefault(); f.o6.value = "4"; f.o7.value = "4"; toast("Sugerencia aplicada; recuerde guardar"); };
  if ($("#reabrir")) $("#reabrir").onclick = async () => {
    const m = prompt("Motivo de la reapertura (queda registrado con fecha):");
    if (!m || !m.trim()) return;
    try { await q(sb.rpc("reabrir_pesos", { p_id: ev.id, p_motivo: m.trim() })); toast("Pesos reabiertos"); router(); } catch(err){ toast(errMsg(err), true); }
  };
  f.onsubmit = async (x) => {
    x.preventDefault();
    const riesgos = {}; ps.forEach(p => riesgos[p.n] = Number(f[`r${p.n}`].value));
    const row = { riesgos_pilar: riesgos };
    if (!lock){
      if (Math.abs(suma()-100) > 0.001) return toast("Los pesos deben sumar 100.", true);
      const pesos = {}, obj = {};
      ps.forEach(p => { pesos[p.n] = Number(f[`p${p.n}`].value); obj[p.n] = Number(f[`o${p.n}`].value); });
      const cambia = ps.some(p => pesos[p.n] !== Number(p.peso));
      const just = f.just.value.trim();
      if (cambia && !just) return toast("Escriba la justificación de los cambios de peso.", true);
      Object.assign(row, { pesos, objetivos: obj, justificacion_pesos: just || null });
    }
    try { await q(sb.from("evaluaciones").update(row).eq("id", ev.id)); toast("Guardado"); router(); } catch(err){ toast(errMsg(err), true); }
  };
}

// =====================================================================
// Cuestionario (11 secciones con nombres neutros, sin códigos ni niveles)
// =====================================================================
async function vistaCuestionario(ev, grupoParam){
  const [pregs, resps] = await Promise.all([preguntas(), q(sb.from("respuestas").select("pregunta_id,opcion_id,ne,evidencia_tipo,fuentes,fuente_texto,fecha_evidencia,comentario").eq("evaluacion_id", ev.id))]);
  const R = new Map(resps.map(r => [r.pregunta_id, r]));
  const grupo = Math.min(11, Math.max(1, Number(grupoParam) || 1));
  const porGrupo = (g) => pregs.filter(p => p.grupo === g);
  const hecha = (id) => { const r = R.get(id); return r && (r.ne || r.opcion_id); };
  const avance = (g) => { const ps = porGrupo(g); return ps.length ? ps.filter(p=>hecha(p.id)).length / ps.length : 0; };
  const total = pregs.filter(p=>hecha(p.id)).length;
  const lista = porGrupo(grupo);

  app.innerHTML = `${tabs(ev,"cuestionario")}
  <div class="card"><div class="row"><b>Avance global</b><span class="right" id="tot">${total} de ${pregs.length}</span></div>
    <div class="prog" style="margin-top:6px"><i id="totbar" style="width:${(total/pregs.length*100).toFixed(1)}%"></i></div>
    <div class="hint" style="margin-top:6px">Elija el escenario que mejor describe lo que ocurre hoy. Cada respuesta se guarda sola. Registre el respaldo con honestidad: una respuesta sin evidencia pesa menos.</div></div>
  <div class="qwrap">
    <nav class="secs card" style="padding:8px">${Object.entries(SECCIONES).map(([g,nm])=>`<a href="#/ev/${ev.id}/cuestionario/${g}" class="${Number(g)===grupo?"on":""}" data-g="${g}">
      <div class="row" style="gap:6px"><span>${g}. ${esc(nm)}</span><span class="right" style="font-size:12px">${porGrupo(Number(g)).filter(p=>hecha(p.id)).length}/${porGrupo(Number(g)).length}</span></div>
      <div class="prog"><i style="width:${(avance(Number(g))*100).toFixed(0)}%"></i></div></a>`).join("")}</nav>
    <div>
      <h2 style="margin-top:0">Sección ${grupo}. ${esc(SECCIONES[grupo])}</h2>
      ${lista.map((p,i)=>preguntaHTML(p, i+1, lista.length, R.get(p.id))).join("")}
      <div class="row">
        ${grupo>1?`<a class="btn sec" href="#/ev/${ev.id}/cuestionario/${grupo-1}">Sección anterior</a>`:""}
        ${grupo<11?`<a class="btn right" href="#/ev/${ev.id}/cuestionario/${grupo+1}">Siguiente sección</a>`:`<a class="btn right" href="#/ev/${ev.id}/resultados">Ver resultados</a>`}
      </div>
    </div>
  </div>`;

  const timers = {};
  const estado = (qid, t, cls="") => { const el = $(`#st-${qid}`); if (el){ el.textContent = t; el.className = "st badge " + cls; } };
  const refrescar = () => {
    const t = pregs.filter(p=>hecha(p.id)).length;
    $("#tot").textContent = `${t} de ${pregs.length}`; $("#totbar").style.width = (t/pregs.length*100).toFixed(1)+"%";
    const a = $(`.secs a[data-g="${grupo}"]`); if (a){ a.querySelector(".right").textContent = `${lista.filter(p=>hecha(p.id)).length}/${lista.length}`; a.querySelector(".prog i").style.width = (avance(grupo)*100).toFixed(0)+"%"; }
  };
  async function guardar(qid){
    const box = $(`#q-${qid}`);
    const ne = box.querySelector("[name=ne]").checked;
    const op = box.querySelector(`input[name="op-${qid}"]:checked`);
    const row = {
      evaluacion_id: ev.id, pregunta_id: qid, ne,
      opcion_id: ne ? null : (op ? op.value : null),
      evidencia_tipo: box.querySelector("[name=ev]").value || null,
      fuentes: Number(box.querySelector("[name=fu]").value),
      fuente_texto: box.querySelector("[name=ft]").value.trim() || null,
      fecha_evidencia: box.querySelector("[name=fe]").value || null,
      comentario: box.querySelector("[name=co]").value.trim() || null
    };
    if (["documento","datos","mejora"].includes(row.evidencia_tipo) && !row.fuente_texto){
      estado(qid, "Describa la fuente para guardar", "warn"); box.querySelector("details").open = true; return;
    }
    if (!row.ne && !row.opcion_id && !R.get(qid)){ return; }
    estado(qid, "Guardando...");
    try {
      await q(sb.from("respuestas").upsert(row, { onConflict: "evaluacion_id,pregunta_id" }));
      R.set(qid, row); estado(qid, row.ne ? "No evaluable" : (row.opcion_id ? "Guardada" : "Sin escenario"), row.ne ? "warn" : (row.opcion_id ? "ok" : "")); refrescar();
    } catch(err){ estado(qid, "Error al guardar", "bad"); toast(errMsg(err), true); }
  }
  $$(".q").forEach(box => {
    const qid = box.dataset.q;
    const plan = (ms) => { clearTimeout(timers[qid]); timers[qid] = setTimeout(()=>guardar(qid), ms); };
    box.addEventListener("change", (e) => {
      if (e.target.name === `op-${qid}`){ $$(".opt", box).forEach(o => o.classList.toggle("on", o.querySelector("input").checked)); }
      if (e.target.name === "ne"){
        box.classList.toggle("isne", e.target.checked);
        if (e.target.checked){ $$(`input[name="op-${qid}"]`, box).forEach(i=>i.checked=false); $$(".opt", box).forEach(o=>o.classList.remove("on")); }
      }
      plan(e.target.tagName === "INPUT" && e.target.type !== "text" ? 0 : 400);
    });
    box.addEventListener("input", (e) => { if (e.target.matches("input[type=text],textarea")) plan(900); });
  });
}

function preguntaHTML(p, k, n, r){
  r = r || {};
  const st = r.ne ? ["warn","No evaluable"] : r.opcion_id ? ["ok","Guardada"] : ["","Pendiente"];
  return `<div class="q ${r.ne?"isne":""}" id="q-${p.id}" data-q="${p.id}">
    <div class="qh"><span class="qn">Pregunta ${k} de ${n}</span><span id="st-${p.id}" class="st badge ${st[0]}">${st[1]}</span></div>
    <div class="qt" style="margin-bottom:10px">${esc(p.enunciado)}</div>
    ${(p.opciones||[]).map(o=>`<label class="opt ${r.opcion_id===o.id?"on":""}"><input type="radio" name="op-${p.id}" value="${o.id}" ${r.opcion_id===o.id?"checked":""}><span>${esc(o.texto)}</span></label>`).join("")}
    <label class="switch" style="margin-top:4px;font-size:14px"><input type="checkbox" name="ne" ${r.ne?"checked":""}> No evaluable (sin evidencia)</label>
    <details class="resp" ${r.evidencia_tipo||r.fuente_texto||r.comentario?"open":""}><summary>Respaldo de esta respuesta</summary>
      <div class="grid g2">
        <div><label class="f">Tipo de respaldo</label><select name="ev"><option value="">Sin indicar (se toma como verbal)</option>${EVIDENCIA.map(([v,l])=>`<option value="${v}" ${r.evidencia_tipo===v?"selected":""}>${l}</option>`).join("")}</select></div>
        <div><label class="f">Fuentes independientes</label><select name="fu"><option value="1" ${r.fuentes!=2?"selected":""}>Una</option><option value="2" ${r.fuentes==2?"selected":""}>Dos o más</option></select></div>
        <div><label class="f">Descripción de la fuente</label><input type="text" name="ft" value="${esc(r.fuente_texto)}" placeholder="Documento, sistema, persona entrevistada"><div class="hint">Obligatoria si el respaldo es documento, datos o mejora.</div></div>
        <div><label class="f">Fecha de la evidencia</label><input type="date" name="fe" value="${esc(r.fecha_evidencia)}"></div>
      </div>
      <div style="margin-top:10px"><label class="f">Comentario</label><textarea name="co">${esc(r.comentario)}</textarea></div>
    </details>
  </div>`;
}

async function vistaResultados(ev){
  app.innerHTML = `${tabs(ev,"resultados")}<div class="empty">Calculando en el servidor...</div>`;
  let R;
  try { R = await q(sb.rpc("calcular_evaluacion", { p_id: ev.id })); ev = await evaluacion(ev.id); }
  catch(err){ R = ev.resultados; toast(errMsg(err), true); }
  if (!R){ app.innerHTML = `${tabs(ev,"resultados")}<div class="empty">Sin resultados todavía. Responda el cuestionario.</div>`; return; }
  app.innerHTML = `${tabs(ev,"resultados")}
    <div class="row noprint" style="margin-bottom:12px"><span class="hint">Calculado: ${ev.calculado_at?new Date(ev.calculado_at).toLocaleString("es-CO"):""}</span>
      <button class="btn sec sm right" id="recalc">Recalcular</button><a class="btn sm" href="#/ev/${ev.id}/roadmap">Ir al roadmap</a></div>
    ${resultadosHTML(R)}`;
  $("#recalc").onclick = () => vistaResultados(ev);
}

function resultadosHTML(R){
  const g = R.global;
  const barras = (obj) => Object.entries(obj).map(([k,v])=>`<div class="bar"><span>${esc(BLOQUES[k] ? k+". "+BLOQUES[k] : k)}</span>
    <div class="tr"><i style="width:${v.nota===null?0:(v.nota/5*100)}%"></i></div><span class="v">${n1(v.nota)}</span></div>`).join("");
  const alertas = [];
  if (R.veto?.activo) alertas.push(`<div class="msg err"><b>Veto de protección activo.</b> La práctica de ${R.veto.pilares.map(n=>R.pilares.find(p=>p.n===n)?.nombre).join(" y ")} está en 1 o menos. El rating no puede superar D.</div>`);
  if (R.alerta_ia?.riesgo_mayor) alertas.push(`<div class="msg err"><b>Alerta de escalamiento de IA.</b> Se escala IA con ${R.alerta_ia.pilares.map(n=>R.pilares.find(p=>p.n===n)?.nombre).join(", ")} por debajo de 2. Es un riesgo mayor aunque la nota global sea alta.</div>`);
  else if (R.alerta_ia?.disparada && R.alerta_ia.no_descartable?.length) alertas.push(`<div class="msg warn"><b>Alerta de IA no descartable:</b> faltan datos de ${R.alerta_ia.no_descartable.map(n=>R.pilares.find(p=>p.n===n)?.nombre).join(", ")}.</div>`);
  const sinRes = R.pilares.filter(p=>p.alerta_actividad);
  if (sinRes.length) alertas.push(`<div class="msg warn"><b>Actividad sin resultado</b> en ${sinRes.map(p=>esc(p.nombre)).join(", ")}: el resultado está 2 o más puntos por debajo de la práctica. Exige causa raíz antes de otras acciones.</div>`);
  return `
  <div class="card"><div class="hero">
    <div class="rating" style="background:${ratingColor(g.rating_calculado)}">${g.rating_calculado || "?"}</div>
    <div><div class="row"><h2 style="margin:0">${g.rating_nombre || "Sin rating"}</h2>
      <span class="badge ${g.provisional?"warn":"ok"}">${g.provisional?"Provisional":"Definitivo"}</span></div>
      <p style="margin:6px 0 12px">${esc(g.veredicto || "No hay pilares evaluables todavía.")}</p>
      <div class="kpis">
        <div class="kpi"><b>${n1(g.nota)}</b><span>Nota global (0 a 5)</span></div>
        <div class="kpi"><b>${n1(g.cobertura)}%</b><span>Cobertura con confianza media o alta</span></div>
        <div class="kpi"><b>${n1(g.peso_ne_o_baja)}</b><span>Peso en NE o confianza baja</span></div>
        <div class="kpi"><b>${R.pilares.filter(p=>!p.ne).length}/11</b><span>Pilares evaluados</span></div>
      </div></div></div>
    ${g.provisional?`<div class="msg warn" style="margin:14px 0 0">Resultado provisional: más de un tercio del peso está en NE o con confianza baja. No se emite rating definitivo.</div>`:""}
  </div>
  ${alertas.join("")}
  <h2>Scorecard por pilar</h2>
  <div class="card tbl" style="padding:0"><table><thead><tr><th>Pilar</th><th>Bloque</th><th class="num">Peso</th><th class="num">Práctica</th><th class="num">Resultado</th><th class="num">Nota</th><th>Confianza</th><th>Alertas</th><th class="num">Respondidas</th></tr></thead><tbody>
  ${R.pilares.map(p=>`<tr><td><b>${p.n}. ${esc(p.nombre)}</b></td><td>${p.bloque}</td><td class="num">${Number(p.peso)}</td>
    <td class="num">${n2(p.practica)}</td><td class="num">${n2(p.resultado)}</td><td class="num"><b>${p.ne?'<span class="badge warn">NE</span>':n2(p.nota)}</b></td>
    <td>${p.confianza && !p.ne?`<span class="badge ${p.confianza==="alta"?"ok":p.confianza==="media"?"":"warn"}">${p.confianza}</span>`:""}</td>
    <td>${p.veto?'<span class="badge bad">Veto</span> ':""}${p.alerta_actividad?'<span class="badge warn">Sin resultado</span>':""}</td>
    <td class="num">${p.respondidas}/${p.total}</td></tr>`).join("")}
  </tbody></table></div>
  <div class="grid g2">
    <div class="card"><h3 style="margin-top:0">Vistas por eje</h3>${barras(R.ejes)}<div class="hint">Los ejes no suman dos veces a la nota global.</div></div>
    <div class="card"><h3 style="margin-top:0">Vistas por bloque</h3>${barras(R.bloques)}</div>
  </div>
  <h2>Compuertas</h2>
  <div class="grid g4">${R.compuertas.map(c=>`<div class="gate"><div class="row"><b>${c.id}. ${esc(c.nombre)}</b><span class="badge ${COMPUERTA[c.estado][0]} right">${COMPUERTA[c.estado][1]}</span></div>
    <div class="hint" style="margin-top:6px">${c.estado==="cumple"?"No frena":"Frena"}: ${esc(c.frena)}</div></div>`).join("")}</div>
  <h2>Prioridad de acción</h2>
  <div class="card tbl" style="padding:0"><table><thead><tr><th>Pilar</th><th class="num">Nota</th><th class="num">Objetivo</th><th class="num">Brecha</th><th class="num">Peso</th><th class="num">Riesgo</th><th class="num">Prioridad</th></tr></thead><tbody>
  ${R.prioridades.map(p=>`<tr><td>${esc(p.nombre)}${p.exige_causa_raiz?' <span class="badge warn">Causa raíz primero</span>':""}</td><td class="num">${n2(p.nota)}</td><td class="num">${p.objetivo}</td>
    <td class="num">${n2(p.brecha)}</td><td class="num">${Number(p.peso)}</td><td class="num">${p.riesgo}</td><td class="num"><b>${p.prioridad===null?"NE":n2(p.prioridad)}</b></td></tr>`).join("")}
  </tbody></table></div>
  <p class="hint">Prioridad = brecha (objetivo menos nota) × peso del pilar × riesgo. NE no es cero: falta información y pasa al registro de brechas.</p>`;
}

// =====================================================================
// Roadmap sugerido y editable
// =====================================================================
async function vistaRoadmap(ev){
  const [ps, acc, bib] = await Promise.all([pilares(), q(sb.from("acciones_roadmap").select("*").eq("evaluacion_id", ev.id).order("prioridad",{ascending:false,nullsFirst:false}).order("created_at")), q(sb.from("biblioteca_acciones").select("*").order("pilar"))]);
  const nom = (n) => ps.find(p=>p.n===n)?.nombre || "Sin pilar";
  const brechas = acc.filter(a=>a.estado==="en_brechas");
  const plan = acc.filter(a=>a.estado!=="en_brechas");
  const tarjeta = (a) => `<div class="act" data-a="${a.id}">
    <div class="row" style="gap:6px"><span class="badge">${esc(nom(a.pilar))}</span>${a.prioridad!==null?`<span class="badge">Prioridad ${n2(a.prioridad)}</span>`:""}${a.origen==="sugerida"?'<span class="badge">Sugerida</span>':""}</div>
    <div style="margin-top:6px"><b>${esc(a.accion)}</b></div>
    ${a.brecha?`<div class="meta">Brecha: ${esc(a.brecha)}</div>`:""}
    ${a.indicador?`<div class="meta">Indicador: ${esc(a.indicador)}</div>`:""}
    <details ${a.estado==="en_brechas"?"":""}><summary class="meta" style="cursor:pointer">Ficha de la acción</summary>
    <div class="grid g2">
      <div><label class="f">Dueño</label><input type="text" name="dueno" value="${esc(a.dueno)}"></div>
      <div><label class="f">Costo estimado</label><input type="number" name="costo_estimado" min="0" step="1" value="${a.costo_estimado??""}"></div>
      <div><label class="f">Fecha</label><input type="date" name="fecha" value="${esc(a.fecha)}"></div>
      <div><label class="f">Horizonte</label><select name="horizonte">${Object.entries(HORIZ).map(([k,l])=>`<option value="${k}" ${a.horizonte===k?"selected":""}>${l}</option>`).join("")}</select></div>
      <div><label class="f">Estado</label><select name="estado">${Object.entries(EST_ACC).map(([k,l])=>`<option value="${k}" ${a.estado===k?"selected":""}>${l}</option>`).join("")}</select></div>
      <div><label class="f">Nivel esperado</label><input type="number" name="nivel_esperado" min="0" max="5" step="0.5" value="${a.nivel_esperado??""}"></div>
      <div><label class="f">Indicador actual</label><input type="text" name="indicador_actual" value="${esc(a.indicador_actual)}"></div>
      <div><label class="f">Meta del indicador</label><input type="text" name="indicador_meta" value="${esc(a.indicador_meta)}"></div>
    </div>
    <div class="grid" style="margin-top:8px">
      <div><label class="f">Causa raíz</label><textarea name="causa_raiz">${esc(a.causa_raiz)}</textarea></div>
      <div><label class="f">Dependencias</label><input type="text" name="dependencias" value="${esc(a.dependencias)}"></div>
      <div><label class="f">Riesgo si no se hace</label><input type="text" name="riesgo_si_no" value="${esc(a.riesgo_si_no)}"></div>
    </div>
    <div class="row" style="margin-top:8px"><button class="btn sm" data-save>Guardar ficha</button><button class="btn danger sm right" data-del>Eliminar</button></div>
    </details></div>`;
  app.innerHTML = `${tabs(ev,"roadmap")}
  <div class="msg info">Regla del plan: ninguna acción entra al roadmap sin dueño, costo y fecha. Si falta algo, queda en el registro de brechas. Los pilares con actividad sin resultado exigen causa raíz primero.</div>
  <div class="row noprint" style="margin-bottom:14px">
    <button class="btn" id="sug" ${ev.resultados?"":"disabled"}>Generar roadmap sugerido</button>
    <span class="hint">${ev.resultados?"Usa las prioridades del último cálculo y la biblioteca de acciones típicas. No borra acciones con dueño, costo o fecha.":"Primero calcule los resultados."}</span>
  </div>
  ${ev.resultados?`<div class="grid g4" style="margin-bottom:14px">${ev.resultados.compuertas.filter(c=>c.estado!=="cumple").map(c=>`<div class="gate"><b>${c.id}. ${esc(c.nombre)}</b> <span class="badge ${COMPUERTA[c.estado][0]}">${COMPUERTA[c.estado][1]}</span><div class="hint">Frena: ${esc(c.frena)}</div></div>`).join("")}</div>`:""}
  <div class="cols">${Object.entries(HORIZ).map(([k,l])=>`<div class="col"><h3>${l}</h3>${plan.filter(a=>a.horizonte===k).map(tarjeta).join("") || '<div class="hint">Sin acciones en plan.</div>'}</div>`).join("")}</div>
  <h2>Registro de brechas <span class="badge">${brechas.length}</span></h2>
  <p class="sub">Acciones sugeridas o propuestas que aún no tienen dueño, costo y fecha. Complete la ficha y cambie el estado a En plan.</p>
  <div class="grid g3">${brechas.map(tarjeta).join("") || '<div class="hint">Sin acciones pendientes.</div>'}</div>
  <h2>Añadir acción</h2>
  <div class="card"><form id="nueva" class="grid g3">
    <div><label class="f">Pilar</label><select name="pilar">${ps.map(p=>`<option value="${p.n}">${p.n}. ${esc(p.nombre)}</option>`).join("")}</select></div>
    <div><label class="f">Desde la biblioteca</label><select name="bib"><option value="">Acción propia</option></select></div>
    <div><label class="f">Horizonte</label><select name="horizonte">${Object.entries(HORIZ).map(([k,l])=>`<option value="${k}">${l}</option>`).join("")}</select></div>
    <div style="grid-column:1/-1"><label class="f">Acción</label><input type="text" name="accion" required></div>
    <div><button class="btn" type="submit">Añadir</button></div>
  </form></div>`;
  const fN = $("#nueva");
  const llenarBib = () => { fN.bib.innerHTML = `<option value="">Acción propia</option>` + bib.filter(b=>b.pilar===Number(fN.pilar.value)).map(b=>`<option value="${b.id}">${HORIZ[b.horizonte]}: ${esc(b.accion)}</option>`).join(""); };
  fN.pilar.onchange = llenarBib; llenarBib();
  fN.bib.onchange = () => { const b = bib.find(x=>x.id===Number(fN.bib.value)); if (b){ fN.accion.value = b.accion; fN.horizonte.value = b.horizonte; } };
  fN.onsubmit = async (x) => {
    x.preventDefault();
    const b = bib.find(y=>y.id===Number(fN.bib.value));
    const pr = ev.resultados?.prioridades?.find(p=>p.n===Number(fN.pilar.value));
    try { await q(sb.from("acciones_roadmap").insert({ evaluacion_id: ev.id, pilar: Number(fN.pilar.value), accion: fN.accion.value.trim(), horizonte: fN.horizonte.value, indicador: b?.indicador || null, prioridad: pr?.prioridad ?? null, origen: "manual" })); toast("Acción añadida al registro de brechas"); vistaRoadmap(ev); }
    catch(err){ toast(errMsg(err), true); }
  };
  $("#sug").onclick = async () => {
    try { const k = await q(sb.rpc("sugerir_roadmap", { p_id: ev.id })); toast(`${k} acciones sugeridas`); vistaRoadmap(ev); } catch(err){ toast(errMsg(err), true); }
  };
  $$(".act").forEach(card => {
    const id = card.dataset.a;
    card.querySelector("[data-save]").onclick = async () => {
      const v = (n) => card.querySelector(`[name=${n}]`).value;
      const row = { dueno: v("dueno").trim()||null, costo_estimado: v("costo_estimado")===""?null:Number(v("costo_estimado")), fecha: v("fecha")||null,
        horizonte: v("horizonte"), estado: v("estado"), nivel_esperado: v("nivel_esperado")===""?null:Number(v("nivel_esperado")),
        indicador_actual: v("indicador_actual").trim()||null, indicador_meta: v("indicador_meta").trim()||null,
        causa_raiz: v("causa_raiz").trim()||null, dependencias: v("dependencias").trim()||null, riesgo_si_no: v("riesgo_si_no").trim()||null };
      try {
        const [r] = await q(sb.from("acciones_roadmap").update(row).eq("id", id).select("estado"));
        if (row.estado !== "en_brechas" && r?.estado === "en_brechas") toast("Falta dueño, costo o fecha: la acción sigue en el registro de brechas.", true);
        else toast("Ficha guardada");
        vistaRoadmap(ev);
      } catch(err){ toast(errMsg(err), true); }
    };
    card.querySelector("[data-del]").onclick = async () => {
      if (!confirm("¿Eliminar esta acción?")) return;
      try { await q(sb.from("acciones_roadmap").delete().eq("id", id)); vistaRoadmap(ev); } catch(err){ toast(errMsg(err), true); }
    };
  });
}

// =====================================================================
// Informe ejecutivo (estructura G) y resumen F
// =====================================================================
async function vistaInforme(ev){
  const acc = await q(sb.from("acciones_roadmap").select("*").eq("evaluacion_id", ev.id).order("prioridad",{ascending:false,nullsFirst:false}));
  const R = ev.resultados;
  const ps = await pilares();
  const nom = (n) => ps.find(p=>p.n===n)?.nombre || "";
  const c = ev.contexto || {};
  const pendientes = CONTEXTO.filter(([k,,req])=>req && !(c[k]||"").trim()).map(([k])=>k);
  const plan = acc.filter(a=>a.estado!=="en_brechas"), brechas = acc.filter(a=>a.estado==="en_brechas");
  const resumenF = R ? textoResumenF(ev, R, acc) : "";
  app.innerHTML = `${tabs(ev,"informe")}
  <div class="row noprint" style="margin-bottom:14px"><button class="btn" onclick="window.print()">Imprimir o guardar en PDF</button>
    ${R?`<button class="btn sec" id="copiar">Copiar resumen para el diagnóstico de madurez digital</button>`:""}</div>
  ${!R?`<div class="msg warn">Calcule los resultados antes de emitir el informe.</div>`:""}
  <article class="informe">
    <div class="hint">Transformación ExO · IT Assessment Board · Marco versión ${esc(ev.version_marco)}</div>
    <h1>Informe ejecutivo de evaluación del área de TI</h1>
    <p class="sub">${esc(ev.empresa)} · ${fecha(ev.calculado_at || ev.updated_at)}</p>
    ${R?`<section><div class="hero"><div class="rating" style="background:${ratingColor(R.global.rating_calculado)}">${R.global.rating_calculado||"?"}</div>
      <div><h2 style="margin:0">${esc(R.global.rating_nombre||"Sin rating")} · ${R.global.provisional?"PROVISIONAL":"DEFINITIVO"}</h2>
      <p>${esc(R.global.veredicto||"")}</p><p class="hint">Nota global ${n1(R.global.nota)} sobre 5. Cobertura con confianza media o alta: ${n1(R.global.cobertura)}%.</p></div></div></section>`:""}
    <section><h2>1. Contexto</h2><div class="grid g2">
      <div><b>Quien diligencia:</b> ${esc(ev.evaluador_nombre)}${ev.evaluador_cargo?", "+esc(ev.evaluador_cargo):""}${ev.evaluador_correo?" · "+esc(ev.evaluador_correo):""}${ev.evaluador_telefono?" · "+esc(ev.evaluador_telefono):""}</div>
      <div><b>Empresa:</b> ${esc(ev.empresa)}${ev.empresa_id_fiscal?" ("+esc(ev.empresa_id_fiscal)+")":""}${ev.sector?" · "+esc(ev.sector):""}${ev.pais?" · "+esc(ev.pais):""}${ev.tamano?" · "+esc(ev.tamano):""}</div>
      <div><b>Decisión que informa:</b> ${esc(ev.decision || c.C2 || "Pendiente")}</div><div><b>Patrocinador:</b> ${esc(ev.patrocinador || c.C3 || "Pendiente")}</div>
      <div><b>Periodo:</b> ${ev.periodo_meses?ev.periodo_meses+" meses":"Pendiente"}</div><div><b>Alcance:</b> ${esc(ev.alcance || "Pendiente")}</div>
    </div>
    ${CONTEXTO.filter(([k])=>(c[k]||"").trim()).map(([k,t])=>`<p><b>${k}.</b> <span class="hint">${esc(t)}</span><br>${esc(c[k])}</p>`).join("")}
    ${pendientes.length?`<div class="msg warn">Contexto obligatorio pendiente: ${pendientes.join(", ")}.</div>`:""}
    ${ev.justificacion_pesos?`<p><b>Ajuste de pesos:</b> ${esc(ev.justificacion_pesos)}</p>`:""}</section>
    ${R?`<section><h2>2. Scorecard y ejes</h2>${resultadosHTML(R)}</section>`:""}
    <section><h2>3. Roadmap</h2>
      ${plan.length?`<div class="tbl"><table><thead><tr><th>Horizonte</th><th>Pilar</th><th>Acción</th><th>Dueño</th><th class="num">Costo</th><th>Fecha</th><th>Indicador y meta</th><th>Estado</th></tr></thead><tbody>
      ${plan.map(a=>`<tr><td>${HORIZ[a.horizonte]}</td><td>${esc(nom(a.pilar))}</td><td>${esc(a.accion)}${a.causa_raiz?`<div class="hint">Causa raíz: ${esc(a.causa_raiz)}</div>`:""}</td><td>${esc(a.dueno)}</td><td class="num">${money(a.costo_estimado)}</td><td>${fecha(a.fecha)}</td><td>${esc([a.indicador,a.indicador_meta&&"meta "+a.indicador_meta].filter(Boolean).join(", "))}</td><td>${EST_ACC[a.estado]}</td></tr>`).join("")}
      </tbody></table></div>`:`<p class="hint">Ninguna acción tiene todavía dueño, costo y fecha.</p>`}</section>
    <section><h2>4. Registro de brechas</h2>
      ${brechas.length?`<div class="tbl"><table><thead><tr><th>Pilar</th><th>Acción propuesta</th><th>Brecha</th><th>Riesgo si no se hace</th><th>Falta</th></tr></thead><tbody>
      ${brechas.map(a=>`<tr><td>${esc(nom(a.pilar))}</td><td>${esc(a.accion)}</td><td>${esc(a.brecha)}</td><td>${esc(a.riesgo_si_no)}</td><td>${[!a.dueno&&"dueño",a.costo_estimado==null&&"costo",!a.fecha&&"fecha"].filter(Boolean).join(", ")}</td></tr>`).join("")}
      </tbody></table></div>`:`<p class="hint">Sin brechas registradas.</p>`}</section>
    <section><h2>5. Límites de esta evaluación</h2><ul>
      ${R?`<li>Pilares no evaluables (NE): ${R.pilares.filter(p=>p.ne).map(p=>esc(p.nombre)).join(", ") || "ninguno"}. NE significa falta de información, no cero.</li>
      <li>Pilares con confianza baja: ${R.pilares.filter(p=>p.confianza==="baja").map(p=>esc(p.nombre)).join(", ") || "ninguno"}.</li>
      <li>Respuestas recortadas por techo de evidencia: ${Object.values(R.techos_aplicados||{}).reduce((a,b)=>a+Number(b),0)}. Una declaración verbal no supera el nivel 2.</li>`:""}
      <li>Periodo evaluado: ${ev.periodo_meses?ev.periodo_meses+" meses":"no definido"}.</li>
      <li>Las respuestas por escenario son declarativas; su peso depende del respaldo registrado.</li></ul>
    </section>
    <div class="legal">Este informe aplica el Marco de evaluación integral del área de TI versión ${esc(ev.version_marco)}. No constituye certificación de auditoría ni concepto legal. No usa benchmarks externos en los puntajes.</div>
  </article>
  ${R?`<h2 class="noprint">Resumen para el diagnóstico de madurez digital</h2><pre class="f noprint" id="rf">${esc(resumenF)}</pre>`:""}`;
  if ($("#copiar")) $("#copiar").onclick = async () => { try { await navigator.clipboard.writeText(resumenF); toast("Resumen copiado"); } catch { toast("No se pudo copiar; seleccione el texto manualmente.", true); } };
}

function textoResumenF(ev, R, acc){
  const g = R.global;
  const ev_ = R.pilares.filter(p=>!p.ne);
  const fuertes = [...ev_].sort((a,b)=>b.nota-a.nota).slice(0,3);
  const brechas = R.prioridades.filter(p=>p.prioridad>0).slice(0,3);
  const deps = [...new Set(acc.map(a=>a.dependencias).filter(Boolean))];
  const L = [];
  L.push(`Empresa: ${ev.empresa.replace(/\.$/, "")}. Fecha: ${fecha(ev.calculado_at)}.`);
  L.push(`Rating: ${g.rating_calculado || "sin rating"} (${g.rating_nombre || ""}), nota ${n1(g.nota)}, ${g.provisional ? "provisional" : "definitivo"}.`);
  L.push("", "Notas por pilar:");
  R.pilares.forEach(p => L.push(`- ${p.nombre}: ${p.ne ? "NE" : n2(p.nota) + (p.confianza ? ", confianza " + p.confianza : "")}`));
  L.push("", "Tres fortalezas:");
  fuertes.forEach(p => L.push(`- ${p.nombre}: nota ${n2(p.nota)} (práctica ${n2(p.practica)}, resultado ${n2(p.resultado)}, confianza ${p.confianza}).`));
  L.push("", "Tres brechas de mayor prioridad:");
  brechas.forEach(p => L.push(`- ${p.nombre}: brecha ${n2(p.brecha)} frente a objetivo ${p.objetivo}, riesgo ${["","bajo","medio","alto"][p.riesgo]}, prioridad ${n2(p.prioridad)}.`));
  L.push("", "Dependencias: " + (deps.join("; ") || "no registradas."));
  const abiertas = R.compuertas.filter(c=>c.estado!=="cumple");
  L.push("Compuertas que frenan: " + (abiertas.map(c=>`${c.id} ${c.nombre} (${COMPUERTA[c.estado][1].toLowerCase()})`).join("; ") || "ninguna."));
  L.push(`Límites: NE en ${R.pilares.filter(p=>p.ne).map(p=>p.nombre).join(", ") || "ningún pilar"}; confianza baja en ${R.pilares.filter(p=>p.confianza==="baja").map(p=>p.nombre).join(", ") || "ningún pilar"}; periodo ${ev.periodo_meses ? ev.periodo_meses + " meses" : "no definido"}.`);
  return L.join("\n");
}

// =====================================================================
// Arranque
// =====================================================================
(async function init(){
  if (!sb) return router();
  const { data } = await sb.auth.getSession();
  sesion = data.session;
  const pintarUsuario = () => { $("#who").textContent = sesion ? sesion.user.email : ""; $("#salir").hidden = !sesion; };
  pintarUsuario();
  $("#salir").onclick = async () => { await sb.auth.signOut(); };
  sb.auth.onAuthStateChange((_e, s) => {
    const antes = !!sesion; sesion = s; pintarUsuario();
    if (!!s !== antes){ cache.pilares = cache.preguntas = null; if (s && /^#\/(login|registro)?$/.test(location.hash||"")) go("#/panel"); else router(); }
  });
  router();
})();
</script>
